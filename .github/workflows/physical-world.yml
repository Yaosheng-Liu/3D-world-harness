name: Physical world

on: [push, pull_request]

permissions:
  contents: read

jobs:
  world-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install isolated test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt -r backend/requirements-world.txt
      - name: Validate editing, physics and authenticated tools
        run: .venv/bin/python -m unittest discover -s backend/tests -p 'test_world_*.py' -v
